<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數學遊戲牆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：方格筆記紙當底，紅筆＋螢光筆當重點色，像老師批改過的作業本 */
:root {
  --paper: #f3f6fa; --grid: rgba(47, 111, 219, .09); --card: #ffffff; --ink: #172238; --muted: #5b6880; --line: #d6dee9;
  --red: #e0453a; --yellow: #ffc93c; --green: #1c9a68; --blue: #2f6fdb; --hl: rgba(255, 201, 60, .45);
  --sky: #dbe9fb; --sky-dot: rgba(47, 111, 219, .35); --cloud: #ffffff;
  --f-display: "Huninn", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --f-num: "Fredoka", "Noto Sans TC", sans-serif;
  --r: 14px; --shadow: 0 2px 0 var(--line), 0 6px 18px rgba(23, 34, 56, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f151d; --grid: rgba(120, 165, 230, .07); --card: #18212d; --ink: #e6edf6; --muted: #95a3b8; --line: #2a3647;
  --red: #ff6b5e; --yellow: #ffd25a; --green: #3ccb8f; --blue: #6c9cff; --hl: rgba(255, 210, 90, .25);
  --sky: #13233a; --sky-dot: rgba(160, 190, 255, .5); --cloud: #2a3a52; --shadow: 0 2px 0 #0a0f15, 0 6px 18px rgba(0, 0, 0, .3); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f151d; --grid: rgba(120, 165, 230, .07); --card: #18212d; --ink: #e6edf6; --muted: #95a3b8; --line: #2a3647;
  --red: #ff6b5e; --yellow: #ffd25a; --green: #3ccb8f; --blue: #6c9cff; --hl: rgba(255, 210, 90, .25);
  --sky: #13233a; --sky-dot: rgba(160, 190, 255, .5); --cloud: #2a3a52; --shadow: 0 2px 0 #0a0f15, 0 6px 18px rgba(0, 0, 0, .3); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body {
  background: var(--paper); color: var(--ink); font: 16px/1.6 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; min-height: 100vh;
}
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.25 }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.row.center { justify-content: center }
.muted { color: var(--muted) } .small { font-size: 14px }

/* 頂端列 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card) }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 2px solid var(--line) }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap }
#brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font-family: var(--f-display); font-size: 22px }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--red); color: #fff; display: grid; place-items: center; font: 700 20px var(--f-num); transform: rotate(-4deg) }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap }
.nav button, .sound button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; color: var(--muted); font-weight: 500 }
.nav button.on { color: var(--ink); background: var(--hl) }
.nav button:hover { color: var(--ink) }
.sound { display: flex; gap: 2px }
.sound button { font-size: 14px; border: 1.5px solid var(--line); padding: 5px 10px }
.sound button.off { opacity: .5; text-decoration: line-through }

main { padding-block: 28px 64px }

/* 首頁 */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: end; margin-bottom: 24px }
.hero h1 { font-size: clamp(40px, 7vw, 68px); letter-spacing: .02em; position: relative; display: inline-block }
.hero h1::after { content: ""; position: absolute; left: -4px; right: -8px; bottom: 6px; height: 18px; background: var(--hl); z-index: -1; transform: skew(-8deg) }
.hero p { max-width: 36em; color: var(--muted); margin: 10px 0 0 }
.search { display: grid; gap: 6px; font-size: 14px; color: var(--muted) }
.search input, .editor input, .editor textarea, .import input, .lb-form input {
  width: 100%; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); outline: none
}
.search input:focus, .editor input:focus, .editor textarea:focus, .import input:focus { border-color: var(--blue) }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px }
.tabs button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 18px; font: 500 17px var(--f-display) }
.tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.chapter { margin-top: 26px }
.chapter h2 { font-size: 20px; margin-bottom: 12px }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.unit-card {
  text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; transition: transform .15s
}
.unit-card:hover { transform: translateY(-3px) }
.unit-num { grid-row: span 2; font: 600 20px var(--f-num); color: var(--red); min-width: 44px; height: 44px; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: 15px }
.unit-title { font-weight: 700; line-height: 1.35 }
.unit-meta { font-size: 13px; color: var(--muted) }
.empty, .empty-box { color: var(--muted); padding: 24px 0 }
.empty-box { background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow) }
.strip { margin-top: 44px; padding-top: 20px; border-top: 2px dashed var(--line) }
.strip h2 { font-size: 20px; margin-bottom: 12px }
.glyph-row { display: flex; flex-wrap: wrap; gap: 8px }

.glyph { --h: 200; width: 56px; height: 56px; flex: none; border-radius: 14px; display: grid; place-items: center; font: 28px var(--f-display); color: #fff;
  background: hsl(var(--h) 72% 52%); box-shadow: inset 0 -4px 0 hsl(var(--h) 70% 40%) }
.glyph.sm { width: 38px; height: 38px; font-size: 19px; border-radius: 10px; box-shadow: inset 0 -3px 0 hsl(var(--h) 70% 40%) }

/* 單元頁 */
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-bottom: 10px }
.crumbs button { border: 0; background: none; color: var(--blue); padding: 0; text-decoration: underline; text-underline-offset: 3px }
.unit-head { margin-bottom: 20px }
.unit-head h1 { font-size: clamp(28px, 5vw, 42px) }
.unit-head p { color: var(--muted); margin: 6px 0 14px; max-width: 44em }
.sec { font-size: 20px; margin: 26px 0 12px }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 16px; font-weight: 500 }
.btn:hover:not(:disabled) { border-color: var(--ink) }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--red) }
.btn.ghost { background: transparent }
.btn.danger { color: var(--red) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn small { opacity: .7; font-size: 12px }
.note { background: var(--hl); padding: 10px 14px; border-radius: 10px; font-size: 14px }
.note textarea { width: 100%; margin-top: 6px }
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px }
.game-card { position: relative; text-align: left; border: 2px solid transparent; background: var(--card); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 2px; align-items: start; transition: transform .15s }
.game-card:hover { transform: translateY(-3px) rotate(-.4deg) }
.game-card.on { border-color: var(--red) }
.game-card .glyph { grid-row: span 2 }
.game-name { font: 19px var(--f-display); align-self: end }
.game-desc { font-size: 13px; color: var(--muted); line-height: 1.45 }
.tag { position: absolute; top: 8px; right: 8px; font-size: 11px; background: var(--hl); padding: 1px 7px; border-radius: 6px; letter-spacing: .04em }
.items { margin-top: 28px; background: var(--card); border-radius: var(--r); padding: 14px 18px; box-shadow: var(--shadow) }
.items summary { cursor: pointer; font-weight: 700 }
.items ol { padding-left: 24px; margin: 12px 0 }
.items li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between }
.items li b { color: var(--red); font-weight: 500 }
.items h3 { font-size: 17px; margin-top: 12px }
.groups { padding-left: 18px }

/* 遊戲頁 */
.play-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px }
.play-title { display: flex; gap: 10px; align-items: center }
.play-title b { font: 20px var(--f-display); display: block; line-height: 1.2 }
.play-title small { color: var(--muted) }
.hud { display: flex; gap: 8px; flex-wrap: wrap; min-height: 40px; margin-bottom: 10px }
.pill { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 3px 14px; font: 600 17px var(--f-num); display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums }
.pill small { font: 400 12px var(--f-body); color: var(--muted) }
.pill.score { border-color: var(--yellow) }
.pill.warn { border-color: var(--red); color: var(--red) }
.pill.note { font: 400 13px var(--f-body); color: var(--muted) }
.pill.lives i { width: 14px; height: 14px; background: var(--red); clip-path: path("M7 13 L1 7 A3.3 3.3 0 0 1 7 2.5 A3.3 3.3 0 0 1 13 7 Z") }
.pill.lives i.off { background: var(--line) }
.stage-wrap { position: relative; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); min-height: 440px }
.stage-wrap:fullscreen { border-radius: 0; overflow: auto; padding: 24px; background: var(--card) }
.stage { padding: 22px; min-height: 440px }
.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--paper) 80%, transparent); backdrop-filter: blur(3px); display: grid; place-items: start center; padding: 16px; z-index: 3; border-radius: 20px; overflow: auto }
.panel { background: var(--card); border-radius: 18px; padding: 22px; box-shadow: 0 10px 40px rgba(0, 0, 0, .18); width: min(520px, 100%); border: 2px solid var(--line) }
.panel.wide { width: min(900px, 100%) }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px }
.result { text-align: center; display: grid; gap: 10px }
.result h2 { font-size: 28px }
.big-score { font: 700 64px/1 var(--f-num); color: var(--red); font-variant-numeric: tabular-nums }
.big-score small { font-size: 28px; color: var(--muted) }
.stars { display: flex; justify-content: center; gap: 6px }
.stars i { width: 40px; height: 40px; background: var(--line); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%) }
.stars i.on { background: var(--yellow); animation: pop .4s backwards } .stars i.on:nth-child(2) { animation-delay: .15s } .stars i.on:nth-child(3) { animation-delay: .3s }
@keyframes pop { from { transform: scale(0) rotate(-60deg) } }
.lb-form { display: grid; gap: 6px; text-align: left; font-size: 14px; color: var(--muted) }
.lb-form .row { flex-wrap: nowrap } .lb-form input { flex: 1; min-width: 0 }
.lb { list-style: none; padding: 0; margin: 0; text-align: left; max-height: 220px; overflow: auto }
.lb li { display: grid; grid-template-columns: 30px 1fr auto 56px; gap: 8px; padding: 5px 8px; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums }
.lb li.me { background: var(--hl); border-radius: 8px }
.lb .rank { font: 600 16px var(--f-num); color: var(--muted) } .lb .sc { font: 600 16px var(--f-num) } .lb .tm { color: var(--muted); text-align: right }

/* 遊戲共用 */
.qtext { font: clamp(22px, 3.6vw, 32px)/1.4 var(--f-display); text-align: center; margin: 6px auto 18px; max-width: 30em; overflow-wrap: anywhere }
.qtext small { display: block; font: 15px var(--f-body); color: var(--muted); margin-top: 4px }
.bad-text { color: var(--red) !important }
.hint-line { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 12px }
.optgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 760px; margin: 0 auto }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 19px; min-height: 64px; transition: transform .1s }
.opt b { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font: 600 17px var(--f-num) }
.opt:nth-child(1) b { background: hsl(8 72% 52%) } .opt:nth-child(2) b { background: hsl(205 72% 50%) } .opt:nth-child(3) b { background: hsl(45 85% 48%) } .opt:nth-child(4) b { background: hsl(150 60% 40%) }
.opt span { overflow-wrap: anywhere; min-width: 0 }
.opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink) }
.opt.ok, .slot.ok { border-color: var(--green); background: color-mix(in srgb, var(--green) 16%, var(--card)) }
.opt.bad, .slot.bad { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--card)) }
.opt:disabled { cursor: default } .opt.gone { opacity: .2 }
.shake { animation: shake .4s }
@keyframes shake { 20%, 60% { transform: translateX(-7px) } 40%, 80% { transform: translateX(7px) } }

/* 益智節目 */
.show-top { display: flex; align-items: center; gap: 14px; max-width: 760px; margin: 0 auto; position: relative }
.show-no { font: 18px var(--f-display); color: var(--muted) }
.show-timer { flex: 1; height: 14px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden }
.show-timer i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(90deg, var(--red), var(--yellow)); transition: width .1s linear }
.show-timer span { position: absolute; right: 8px; top: -3px; font: 600 14px var(--f-num); color: var(--ink) }
.gain { position: absolute; right: 0; top: -30px; font: 700 26px var(--f-num); color: var(--green); animation: rise 1s forwards }
@keyframes rise { to { transform: translateY(-20px); opacity: 0 } }
.lifelines { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px }
.lifelines button { border: 2px dashed var(--muted); background: none; border-radius: 99px; padding: 6px 16px; font-size: 14px }
.lifelines button.active { border-style: solid; border-color: var(--yellow); background: var(--hl) }
.lifelines button:disabled { opacity: .35; text-decoration: line-through; cursor: default }

/* 配對 */
.match { max-width: 820px; margin: 0 auto }
.match-rows { display: grid; gap: 10px }
.mrow { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; align-items: stretch }
.mq { background: var(--paper); border-radius: 12px; padding: 12px 14px; font-weight: 500; overflow-wrap: anywhere }
.slot { border: 2px dashed var(--muted); border-radius: 12px; background: none; color: var(--muted); padding: 10px; overflow-wrap: anywhere }
.slot.filled { border-style: solid; border-color: var(--blue); color: var(--ink); font-weight: 700 }
.pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; min-height: 50px }
.chip { border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--card)); border-radius: 12px; padding: 9px 16px; font-weight: 700 }
.chip.sel { background: var(--blue); color: #fff; transform: translateY(-3px); box-shadow: 0 6px 0 color-mix(in srgb, var(--blue) 50%, transparent) }

/* 翻牌記憶 */
.memory { display: grid; gap: 12px; max-width: 780px; margin: 0 auto; grid-template-columns: repeat(4, 1fr) }
.mcard { aspect-ratio: 4/3; max-width: 100%; border: 0; padding: 0; background: none; perspective: 700px; position: relative }
.mcard span { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; padding: 8px; backface-visibility: hidden; transition: transform .45s; overflow-wrap: anywhere; font-size: 15px; line-height: 1.35 }
.mcard .back { background: var(--blue); color: #fff; font: 600 34px var(--f-num); background-image: radial-gradient(rgba(255, 255, 255, .18) 2px, transparent 2px); background-size: 14px 14px }
.mcard .face { transform: rotateY(180deg); background: var(--paper); border: 2px solid var(--line); font-weight: 500 }
.mcard.a .face { background: var(--hl); font-weight: 700; font-size: 18px }
.mcard.open .back { transform: rotateY(180deg) } .mcard.open .face { transform: rotateY(360deg) }
.mcard.done .face { border-color: var(--green); opacity: .65 }

/* 尋找配對 */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 820px; margin: 0 auto }
.tile { min-height: 76px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); font-size: 18px; font-weight: 700; padding: 8px; transition: transform .25s, opacity .25s; overflow-wrap: anywhere }
.tile:hover { border-color: var(--ink) }
.tile.gone { transform: scale(.4); opacity: 0; pointer-events: none }

/* 打地鼠 */
.holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 600px; margin: 0 auto }
.hole { aspect-ratio: 1.2; max-width: 100%; position: relative; overflow: hidden }
.hole::before { content: ""; position: absolute; left: 10%; right: 10%; bottom: 8%; height: 22%; border-radius: 50%; background: #2a1d13 }
.hole::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 0; height: 16%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; background: #6b4a2e; z-index: 2 }
.mole { position: absolute; left: 14%; right: 14%; bottom: 10%; height: 82%; border: 0; background: none; padding: 0; transform: translateY(125%); transition: transform .18s ease-out; z-index: 1 }
.mole.up { transform: translateY(0) }
.mole .body { position: absolute; inset: 30% 10% 0; background: #9a6b45; border-radius: 50% 50% 20% 20%; box-shadow: inset 0 -8px 0 #7b5333 }
.mole .body::before { content: ""; position: absolute; left: 28%; right: 28%; top: 22%; height: 12%; background: radial-gradient(circle at 15% 50%, #111 30%, transparent 32%), radial-gradient(circle at 85% 50%, #111 30%, transparent 32%) }
.mole .sign { position: absolute; left: -8%; right: -8%; top: 0; z-index: 2; background: #fffbe8; color: #172238; border: 2px solid #7b5333; border-radius: 8px; font: 700 clamp(12px, 2.6vw, 17px)/1.25 var(--f-body); padding: 4px; overflow-wrap: anywhere }
.mole.hit .sign { background: #c9f5df } .mole.miss .sign { background: #ffd6d2 }
.mole.hit .body { transform: scaleY(.7); transform-origin: bottom }

/* 氣球 */
.sky { position: relative; height: min(60vh, 460px); overflow: hidden; border-radius: 16px; background: linear-gradient(var(--sky), var(--card)) }
.balloon { --h: 200; position: absolute; top: 0; width: 120px; height: 140px; border: 0; padding: 0; background: none }
.balloon span { position: absolute; inset: 0 0 20px; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%; background: radial-gradient(circle at 32% 28%, hsl(var(--h) 90% 80%), hsl(var(--h) 75% 52%) 55%); color: #fff;
  display: grid; place-items: center; font: 700 16px/1.25 var(--f-body); padding: 10px; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); overflow-wrap: anywhere }
.balloon::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 2px; height: 24px; background: var(--muted) }
.balloon.popped span { animation: burst .3s forwards } .balloon.popped::after { opacity: 0 }
.balloon.ok span { background: var(--green) } .balloon.bad span { background: var(--red) }
@keyframes burst { to { transform: scale(1.6); opacity: 0 } }

/* 是非 */
.tf { max-width: 680px; margin: 0 auto; text-align: center }
.tf-bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px }
.tf-bar i { display: block; height: 100%; width: 100%; background: var(--blue) }
.tf-ans { font-size: 24px; margin-bottom: 20px } .tf-ans b { background: var(--hl); padding: 2px 10px; border-radius: 8px }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
.tf-btns button { border: 0; border-radius: 18px; padding: 22px; font: 34px var(--f-display); color: #fff; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .2) }
.tf-btns small { font: 14px var(--f-body); opacity: .7 }
.tf-yes { background: var(--green) } .tf-no { background: var(--red) }
.tf-msg, .type-msg { min-height: 28px; margin-top: 14px; color: var(--muted) }
.tf-msg.ok, .type-msg.ok { color: var(--green); font-weight: 700 } .tf-msg.bad, .type-msg.bad { color: var(--red) }

/* 轉盤 */
.wheel { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start }
.wheel-box { position: relative; display: grid; place-items: center }
.pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border: 16px solid transparent; border-top: 26px solid var(--ink); border-bottom: 0 }
.spin { position: absolute; width: 64px; height: 64px; border-radius: 50% !important; padding: 0 !important; font: 22px var(--f-display) }
.wheel-side { flex: 1 1 260px; max-width: 420px; display: grid; gap: 12px }
.wcard { background: var(--paper); border-radius: 16px; padding: 18px; text-align: center; min-height: 160px; display: grid; gap: 10px; align-content: center; justify-items: center }
.wnum { font: 600 14px var(--f-num); color: var(--red); letter-spacing: .08em }
.wans { font: 26px var(--f-display); color: var(--green); background: var(--card); padding: 6px 18px; border-radius: 10px }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted) }

/* 開箱子 */
.boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; max-width: 760px; margin: 0 auto }
.box { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 14px; position: relative; background: #c98a4b; color: #fff; box-shadow: inset 0 -8px 0 #a26a35; display: grid; place-items: center; transition: transform .15s; overflow: hidden }
.box .lid { position: absolute; inset: 0 0 auto; height: 30%; background: #dca066; border-bottom: 3px solid #a26a35; transition: transform .3s }
.box .n { font: 700 34px var(--f-num); position: relative }
.box:hover:not(.done) { transform: translateY(-4px) rotate(-2deg) }
.box.opening .lid { transform: translateY(-110%) }
.box.done { background: var(--paper); color: var(--ink); box-shadow: none; border: 2px solid var(--line); cursor: default; align-content: center; gap: 2px; padding: 6px }
.box.done.ok .n { color: var(--green) } .box.done.bad .n { color: var(--red) }
.box.done small { font-size: 13px; overflow-wrap: anywhere }
.box-modal { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 75%, transparent); border-radius: 20px; padding: 16px; z-index: 2 }
.box-modal .panel { width: min(720px, 100%) }

/* 閃卡、翻轉方塊 */
.flash { max-width: 560px; margin: 0 auto; display: grid; gap: 18px }
.fcard, .ftile { border: 0; padding: 0; background: none; perspective: 900px; position: relative }
.fcard { height: 280px }
.fcard > span, .ftile > span { position: absolute; inset: 0; border-radius: 18px; display: grid; place-items: center; align-content: center; gap: 8px; padding: 18px; backface-visibility: hidden; transition: transform .5s; overflow-wrap: anywhere }
.fcard .ff { background: var(--paper); border: 2px solid var(--line); font: 28px/1.4 var(--f-display) }
.fcard .ff small { font: 13px var(--f-body); color: var(--muted) }
.fcard .fb { background: var(--blue); color: #fff; font: 34px var(--f-display); transform: rotateY(180deg) }
.flipped .ff { transform: rotateY(180deg) } .flipped .fb { transform: rotateY(360deg) }
.ftiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px }
.ftile { height: 130px }
.ftile .ff { background: var(--paper); border: 2px solid var(--line); font-size: 15px; font-weight: 500 }
.ftile .fb { background: hsl(170 55% 40%); color: #fff; font: 22px var(--f-display); transform: rotateY(180deg) }

/* 分類 */
.sort { max-width: 860px; margin: 0 auto }
.sort-card { margin: 0 auto 22px; max-width: 440px; background: var(--yellow); color: #172238; border-radius: 14px; padding: 18px; text-align: center; font: 22px/1.4 var(--f-display); box-shadow: 0 6px 0 rgba(0, 0, 0, .12); transform: rotate(-1.5deg); overflow-wrap: anywhere }
.bins { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr) }
.bins.cols-3 { grid-template-columns: repeat(3, 1fr) } .bins.cols-4 { grid-template-columns: repeat(4, 1fr) }
.bin { border: 2px dashed var(--muted); border-radius: 16px; background: var(--paper); min-height: 150px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center }
.bin:hover { border-color: var(--ink); border-style: solid }
.bin b { font: 19px var(--f-display) }
.bin-items { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center }
.bin-items i { font-style: normal; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px }

/* 迷宮 */
.maze { display: grid; gap: 10px; justify-items: center }
.maze .qtext { margin-bottom: 8px; font-size: clamp(19px, 3vw, 26px) }
.maze-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; max-width: 640px }
.maze-opts span { display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere }
.maze-opts b { flex: none; width: 26px; height: 26px; border-radius: 6px; color: #fff; display: grid; place-items: center; font: 600 15px var(--f-num) }
.maze-opts span:nth-child(1) b { background: hsl(8 75% 55%) } .maze-opts span:nth-child(2) b { background: hsl(45 75% 50%) } .maze-opts span:nth-child(3) b { background: hsl(150 65% 42%) } .maze-opts span:nth-child(4) b { background: hsl(280 65% 55%) }
.maze-board { position: relative; max-width: 100%; border-radius: 10px; overflow: hidden }
.maze-board canvas, .air-board canvas { display: block; max-width: 100% }
.maze-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 26px var(--f-display); background: color-mix(in srgb, var(--card) 70%, transparent); padding: 10px }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 6px }
.dpad button { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; font-size: 20px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none }
.dpad button:active { background: var(--hl); border-color: var(--ink) }
.dpad [data-d="u"] { grid-column: 2 } .dpad [data-d="l"] { grid-column: 1; grid-row: 2 } .dpad [data-d="d"] { grid-column: 2; grid-row: 2 } .dpad [data-d="r"] { grid-column: 3; grid-row: 2 }

/* 飛機 */
.air { display: grid; gap: 12px; justify-items: center }
.air .qtext { margin-bottom: 0 }
.air-board { border-radius: 14px; overflow: hidden; max-width: 100%; touch-action: manipulation }

/* 重組 */
.ana { text-align: center }
.ana-slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px }
.aslot, .atile { width: 52px; height: 58px; border-radius: 12px; font: 600 24px var(--f-num); display: grid; place-items: center; padding: 0 }
.aslot { border: 2px dashed var(--muted); background: none }
.aslot.filled { border-style: solid; border-color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--card)) }
.ana-slots.ok .aslot { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--card)) }
.ana-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px }
.atile { border: 0; background: var(--yellow); color: #172238; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15) }
.atile:disabled { opacity: .15; cursor: default }

/* 輸入答案 */
.type { max-width: 640px; margin: 0 auto; text-align: center }
.type-form { display: flex; gap: 10px }
.type-form input { flex: 1; min-width: 0; font: 600 24px var(--f-num); padding: 12px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); text-align: center; outline: none }
.type-form input:focus { border-color: var(--blue) }
.type-form input.ok { border-color: var(--green) } .type-form input.bad { border-color: var(--red) }
.sym { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px }
.sym button { min-width: 42px; height: 40px; border: 2px solid var(--line); background: var(--card); border-radius: 10px; font: 600 18px var(--f-num) }

/* 建立活動 */
.editor { display: grid; gap: 8px; max-width: 820px; background: var(--card); padding: 20px; border-radius: var(--r); box-shadow: var(--shadow) }
.editor label { font-weight: 700; margin-top: 8px }
.editor textarea { font: 15px/1.6 ui-monospace, Consolas, "Noto Sans TC", monospace; resize: vertical }
.hint { margin: 0; color: var(--muted); font-size: 14px }
.hint code { background: var(--hl); padding: 1px 6px; border-radius: 6px; font-size: 13px }
.import { margin-top: 24px; max-width: 820px }
.import form { flex-wrap: nowrap } .import input { flex: 1; min-width: 0 }

@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr }
  .optgrid, .tf-btns { grid-template-columns: 1fr }
  .mrow { grid-template-columns: 1fr }
  .memory { grid-template-columns: repeat(3, 1fr) }
  .bins.cols-3, .bins.cols-4 { grid-template-columns: repeat(2, 1fr) }
  .stage { padding: 14px }
  .nav { margin-left: 0; width: 100%; order: 3 }
  .sound { margin-left: auto }
  .opt { font-size: 17px; min-height: 54px }
  .fcard { height: 230px }
  .play-bar .row { width: 100% }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important } }
</style>

<style>
  #qr-fab { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem; font-family: 'Noto Sans TC', sans-serif; }
  #qr-panel { background: #1a2035; border: 1px solid #2a3350; border-radius: 16px; padding: 1.4rem 1.4rem 1rem; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.5); display: none; flex-direction: column; align-items: center; gap: 0.7rem; min-width: 190px; animation: qrFadeIn 0.2s ease; }
  #qr-panel.open { display: flex; }
  @keyframes qrFadeIn { from { opacity:0; transform: translateY(10px) scale(0.96); } to { opacity:1; transform: translateY(0) scale(1); } }
  #qr-panel-title { font-size: 0.82rem; font-weight: 600; color: #e8eaf2; line-height: 1.4; max-width: 170px; }
  #qr-panel img { width: 160px; height: 160px; background: #fff; border-radius: 10px; padding: 6px; display: block; }
  #qr-panel-url { font-size: 0.58rem; color: #7a8099; word-break: break-all; max-width: 170px; line-height: 1.4; font-family: monospace; }
  #qr-panel-close { font-size: 0.72rem; color: #7a8099; background: none; border: 1px solid #2a3350; border-radius: 100px; padding: 0.2rem 0.8rem; cursor: pointer; transition: color 0.15s; }
  #qr-panel-close:hover { color: #e8eaf2; }
  #qr-toggle-btn { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #00c9a7, #7c6ded); border: none; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 20px rgba(0,201,167,0.4); transition: transform 0.2s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; }
  #qr-toggle-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(0,201,167,0.6); }
</style>
<div id="qr-fab">
  <div id="qr-panel">
    <div id="qr-panel-title">數學遊戲牆</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https%3A%2F%2Fcwmps.github.io%2Fgames%2Fmath-game-wall%2F" alt="QR Code" loading="lazy"/>
    <div id="qr-panel-url">https://cwmps.github.io/games/math-game-wall/</div>
    <button id="qr-panel-close" onclick="toggleQR()">關閉</button>
  </div>
  <button id="qr-toggle-btn" onclick="toggleQR()" title="掃描 QR Code">📱</button>
</div>
<script>
  function toggleQR() { document.getElementById('qr-panel').classList.toggle('open'); }
  document.addEventListener('click', function(e) {
    const fab = document.getElementById('qr-fab');
    if (fab && !fab.contains(e.target)) document.getElementById('qr-panel').classList.remove('open');
  });
</script>
